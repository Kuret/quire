<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  Reproduces what the mobile reader answers for a series the publisher has
  licensed: **HTTP 200, with a notice where the images should be.** The series
  still has a page, a chapter list and working links; only the pages are gone.

  This is the case that would otherwise reach the user as "this chapter has no
  images", which reads as a Quire bug rather than as the site's decision.
  Pages() matches the notice and says what happened. It is a real distinction
  and not a cosmetic one: one of those is worth retrying and the other never
  will be.

  Note what this fixture is *not*: it is not a challenge, and must not be
  reported as one. There is no interstitial, no 403 and no CDN marker — the
  site answered honestly and the answer was no.

  Why synthetic: see testdata/home.html. Host is example.invalid (RFC 2606).
-->
