<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  Reproduces a search results page. The rows are a manga-list-4-list, and the
  trap they set is that each row contains *four* anchors pointing at four
  different things: the cover, the title, the status tag and the author's own
  listing page. Reading "every anchor in the list" gives four results per
  series, three of which are duplicates and one of which is not a series at
  all.

  Deliberate variations exercised by the test:
    - the author link goes to /search/author/..., which is neither a series nor
      a chapter and must be dropped
    - a chapter link in the "latest" line of a row must not become a result
    - the second row's anchor carries no title attribute, so the title has to
      come from the item-title paragraph instead
    - one title attribute is padded by the template

  Why synthetic: see testdata/home.html. Host is example.invalid (RFC 2606).
-->
