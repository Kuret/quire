<!--
  SYNTHETIC FIXTURE — not a recording of any site. See home.html for the note
  on placeholders and provenance.

  Reproduces a genre/tag listing page's own shape, /tag/{slug}/: the same
  gallery-card markup home.html and search.html use, plus a pagination widget
  whose page-2 link is a query-string URL (nhentai.xxx's own scheme,
  ?page=2) — deliberately the *other* shape from tags.html's path-style
  pagination link, so a test can confirm listGenre reads whichever URL the
  page actually offers rather than assuming one form.
-->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tag: Sample Tag - Example Doujin Reader</title></head>
<body>
  <div class="listing">
    <div class="thumb" data-tags="1 2" data-artists="9" data-categories="1">
      <a href="/g/42/">
        <img class="lazy" src="data:image/gif;base64,AA==" data-src="https://images.example.invalid/005/42/thumb.jpg" alt="A Story About Nothing in Particular">
      </a>
    </div>
  </div>
  <ul class="pagination">
    <li class='page-item disabled'><a class='page-link' href='#'>Previous</a></li>
    <li class='page-item active'><a class='page-link' href='#'>1</a></li>
    <li class='page-item'><a class='page-link' href='//example.invalid/tag/sample-tag/?page=2'>2</a></li>
  </ul>
</body></html>
