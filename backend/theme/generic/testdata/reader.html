  SYNTHETIC FIXTURE — not a recording of any site.

  Two readers in one file, because the generic theme has two ways to read a
  page list and both need a fixture:

    - .frame img is reachable by a plain selector
    - the window.__PAGES__ blob below is not: the URLs are stored as a
      base64-encoded JSON array, which no CSS selector can reach. That is the
      one situation PLAN §6 M2's goja hook exists for.

  The encoded array decodes to the same five URLs as .frame img would give if
  it were complete, so a test can assert the script path and the selector path
  agree.

  Why synthetic: PLAN §1.3 forbids source URLs in this repository. Host is
  example.invalid (RFC 2606).
-->
