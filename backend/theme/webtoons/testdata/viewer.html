<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  Reproduces an episode viewer. The page images hang off a single #_imageList,
  and **the real URL is in data-url, not in src** — src holds a transparent
  placeholder until the reader scrolls past. A theme reading src returns a
  chapter of blank gifs, which is why Pages() reads data-url and does not use
  theme.ImageURL: that helper knows the lazy-load attributes WordPress plugins
  use, and this is not one of them.

  The images are strips: the height attributes here are the real shape of this
  platform's pages, several thousand pixels tall against a narrow width. PLAN
  §6 M4 fits one into a 3:4 page, which turns a strip into a centred sliver.
  That is a known limitation recorded in docs/THEME-NOTES.md and deliberately
  not addressed by this theme.

  Deliberate variations exercised by the test:
    - every URL carries a rendition parameter, which the fullQualityImages
      override removes and which must survive untouched when it is off
    - one <img> has no data-url at all — the platform emits a spacer — and must
      be skipped rather than yielding an empty page
    - the URLs are on a different registrable domain from the site, which is
      what AllowedHosts() exists for

  Why synthetic: see testdata/home.html. Host is example.invalid (RFC 2606).
-->
