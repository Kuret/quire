<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  A deliberate near-miss. This is a WordPress comic site that belongs to
  NEITHER tier-1 family, but which shares as much surface with both as a
  plausible site can:

    - it is WordPress, with wp-content, wp-json and a generator meta tag
    - it has a grid of cards and a chapter list, like both families
    - its class names rhyme with both: "bsx-like" and "post-title" appear,
      as do generic "listing" and "chapter" words
    - it even has a reading area with lazy-loaded images

  What it does NOT have is either family's conclusive signal: no
  /wp-content/plugins/madara/ path, no wp-manga post type, no
  manga_get_chapters action, no ts_reader.run({...}) blob, no #chapterlist,
  no #readerarea.

  The test that uses this file asserts both themes score it low and that
  neither one "wins" it. That is the difference between a probe that can say
  "unrecognised" (PLAN §7.5) and one that confidently mis-assigns a theme and
  then reports every empty result as the site's fault.

  Why synthetic: PLAN §1.3 forbids source URLs in this repository. Host is
  example.invalid (RFC 2606).
-->
