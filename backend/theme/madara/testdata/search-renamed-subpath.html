<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  Reproduces the *other* search skin the plugin ships: a
  .page-listing-item wrapping several .page-item-detail cards, rather than
  the .c-tabs-item__content list in testdata/search.html. Real installs use
  either shape depending on the theme skin layered on top of the plugin.

  It also reproduces a second, separate fact found live on 2026-09-21 while
  investigating a "recognised the site, then searched to zero results" report
  (PLAN §9): two real installs answer this query with their series links under
  a path segment that is neither the "manga" default nor one of the documented
  common renames ("series", "comics") — one used "/serie/", the other
  "/porncomic/". mangaSubPath exists precisely for this, but a probe has no
  override configured yet, so Search() cannot be told the answer in advance;
  it has to work it out from the response in front of it. This fixture's
  series links all sit under "/toons/", invented here the same way every
  other path in this file is, to prove that guess is unnecessary: the segment
  the majority of candidates agree on wins, and the one item under a
  different segment — a decoy exactly like the "manga-tag" one in
  testdata/search.html, just spelled to match this fixture's renamed
  vocabulary — loses the vote and is dropped, with no mangaSubPath override
  set at all.

  Why synthetic: see testdata/search.html. Host is example.invalid (RFC 2606).
-->
