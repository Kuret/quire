<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  Reproduces the shape a Madara reader page generates: a .reading-content
  containing one .page-break per image, with the image URLs lazy-loaded out of
  src into data-src and a base64 placeholder left behind. Reading src first
  would yield a chapter of grey squares, which is the single most likely way to
  get this theme subtly wrong.

  Deliberate variations exercised by the test:
    - page 1 uses data-src with a base64 placeholder in src
    - page 2 uses a plain src (some sites disable lazy loading)
    - page 3 uses data-lazy-src (a different lazy-loading plugin)
    - page 4 uses a protocol-relative URL, which must resolve against https
    - page 5 uses a site-relative path, which must resolve against baseUrl
    - the URLs carry leading whitespace, which the plugin's templating leaves
      behind and which must be trimmed or the request 404s

  Why synthetic: see testdata/search.html. Host is example.invalid (RFC 2606).

  FIDELITY CORRECTION 2026-09-16 — the asset path in this fixture used to be
  /wp-content/plugins/madara/, which no live install serves. Madara is
  distributed as a WordPress *theme*, so its assets come from
  /wp-content/themes/madara/, and its companion plugin registers as
  `madara-core`. The old string was invented here and then "verified" against
  these fixtures, which is how a fingerprint that scored 88 on our own pages
  came to score 43 on a real one.
-->
