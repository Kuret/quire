<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  Reproduces the shape a mangakakalot-family *home* page generates. This is the
  page PLAN §7.5 stage 4 actually fingerprints, and it is worth its own fixture
  because it carries none of the series, reader or listing markup the other
  fixtures do: a probe that only recognised those would call a real site of
  this family "unrecognised" on the one page it gets to see.

  The markers here are the family's own latest-releases grid: a #contentstory
  wrapper, its .doreamon row, and .itemupdate cards whose cover anchor carries
  the bookmark class.

  Why synthetic: PLAN §1.3 forbids this repository from containing a real
  aggregator's domain or content, and §1.4 forbids copying anyone's expression.
  The markup *shape* is an observable fact about the software; the words and
  the host are ours. Host is example.invalid (RFC 2606) and can never resolve.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example Comics — read comics online</title>
</head>
<body>
<div class="body-site">
  <div class="panel-content-homepage">
    <div class="daily-update">
      <h2 class="title update-title" title="Latest Releases">LATEST RELEASES</h2>
    </div>
    <div id="contentstory">
      <div class="doreamon">
        <div class="itemupdate first">
          <a data-tooltip="sticky_1001" data-id="1001" class="tooltip cover bookmark_check"
             href="https://example.invalid/manga/the-lantern-keeper" title="The Lantern Keeper">
            <img src="https://images.example.invalid/thumb/the-lantern-keeper.webp"
                 data-src="https://images.example.invalid/thumb/the-lantern-keeper.webp"
                 alt="The Lantern Keeper" class="lazy" width="100%" height="100%">
          </a>
          <ul>
            <li><h3><a class="tooltip" href="https://example.invalid/manga/the-lantern-keeper">The Lantern Keeper</a></h3></li>
            <li><span class="sts sts_1"><a href="https://example.invalid/manga/the-lantern-keeper/chapter-4">Chapter 4</a></span></li>
          </ul>
        </div>
        <div class="itemupdate">
          <a data-tooltip="sticky_1002" data-id="1002" class="tooltip cover bookmark_check"
             href="https://example.invalid/manga/paper-birds" title="Paper Birds">
            <img src="https://images.example.invalid/thumb/paper-birds.webp"
                 data-src="https://images.example.invalid/thumb/paper-birds.webp"
                 alt="Paper Birds" class="lazy" width="100%" height="100%">
          </a>
          <ul>
            <li><h3><a class="tooltip" href="https://example.invalid/manga/paper-birds">Paper Birds</a></h3></li>
            <li><span class="sts sts_1"><a href="https://example.invalid/manga/paper-birds/chapter-11">Chapter 11</a></span></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="panel-topview">
      <h2 class="title all-title">Most Popular</h2>
      <div class="xem-nhieu-item">
        <h3><a href="https://example.invalid/manga/the-lantern-keeper" title="The Lantern Keeper">The Lantern Keeper</a></h3>
      </div>
    </div>
  </div>
</div>
</body>
</html>
