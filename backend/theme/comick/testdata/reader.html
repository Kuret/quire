<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  Reproduces a chapter page. As with the series page, the data is served as
  JSON in a script element and the markup is what the frontend does with it —
  so Pages() reads the payload and never the <img> tags, which on a real page
  are rendered client-side and are not in this document at all.

  Deliberate variations exercised by the test:
    - the document carries the *third-party* script element too, and a
      like-named element that is not JSON, so requiring the declared type is
      load-bearing rather than defensive
    - the image URLs are on a different registrable domain from the site, which
      is what AllowedHosts() exists for, and that host answers 403 to a request
      that does not name the page they came from — see PageReferer and PLAN
      §7.6
    - one entry in the payload has an empty URL and must be skipped


  **Updated 2026-09-16 to carry the application shell.** The first version of
  this fixture had only the payload and the markup around it, which is what the
  theme reads — and a fingerprint tuned against it scored 25 on the real root.
  Every live rendering carries the Laravel/Vite build tags and the Alpine
  namespace, so a fixture without them does not resemble the page it stands
  for. See testdata/home.html and PLAN §9.

  Why synthetic: see testdata/search.json. Host is example.invalid (RFC 2606).
-->
