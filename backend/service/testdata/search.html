<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  Reproduces the shape a Madara (WordPress wp-manga plugin) search results page
  generates: WordPress's stock /?s=&post_type=wp-manga query answered with a
  list of .c-tabs-item__content blocks, each holding a .tab-thumb image and a
  .post-title heading whose anchor is the series permalink.

  Why synthetic: PLAN §1.3 forbids this repository from containing source URLs
  or anything that functions as a catalogue, and §1.4 forbids copying others'
  expression. The markup *structure* is a documented, observable property of a
  commercially distributed plugin; the content here is invented and the host is
  example.invalid (RFC 2606), which can never resolve.

  Deliberate variations exercised by the test:
    - the third item uses <h4> rather than <h3> (skin variation)
    - covers are lazy-loaded via data-src with a base64 placeholder in src
    - one link points at a tag page, which must NOT become a search result
    - one link points off-site, which must NOT become a search result
-->
