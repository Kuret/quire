<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  Reproduces the shape of a Madara (WordPress wp-manga plugin) *home page*: the
  plugin's own stylesheet under /wp-content/plugins/madara/, a body class
  carrying the wp-manga custom post type, and a listing of .c-tabs-item__content
  cards. This is what PLAN §7.5 stage 2 fetches and stages 3 and 4 judge.

  Why synthetic: PLAN §1.3 forbids this repository from containing source URLs
  or anything that functions as a catalogue, and §1.4 forbids copying others'
  expression. The markup *structure* is a documented, observable property of a
  commercially distributed plugin; the content here is invented and the host is
  example.invalid (RFC 2606), which can never resolve.

  Deliberate variations exercised by the tests:
    - a <title> with a marketing tail, so the default source name has to be
      trimmed back to "Example Reader" (probe stage 6);
    - <html lang="en-GB">, so the draft source's lang is derived, not assumed;
    - enough madara signal to clear the fingerprint threshold of 60 without the
      reader-specific markup a home page would not have.
-->
<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <title>Example Reader - Read comics online, free and updated daily</title>
    <link rel="stylesheet" href="https://example.invalid/wp-content/plugins/madara/css/style.css?ver=1.7.3">
    <link rel="https://api.w.org/" href="https://example.invalid/wp-json/">
</head>
<body class="home blog post-type-archive-wp-manga">
<header class="c-blog__heading">
    <h1 class="h4">Latest updates</h1>
</header>

<div class="c-page-content">
    <div class="main-col-inner">
        <div class="tab-content-wrap">
            <div class="c-tabs-item">
                <div class="c-tabs-item__content">
                    <div class="tab-thumb c-image-hover">
                        <a href="https://example.invalid/manga/the-lantern-keeper/" title="The Lantern Keeper">
                            <img src="https://example.invalid/wp-content/uploads/2026/01/lantern-keeper-193x278.jpg" alt="">
                        </a>
                    </div>
                    <div class="tab-summary">
                        <div class="post-title">
                            <h3><a href="https://example.invalid/manga/the-lantern-keeper/">The Lantern Keeper</a></h3>
                        </div>
                    </div>
                </div>

                <div class="c-tabs-item__content">
                    <div class="tab-thumb c-image-hover">
                        <a href="https://example.invalid/manga/salt-and-cedar/" title="Salt and Cedar">
                            <img src="https://example.invalid/wp-content/uploads/2026/02/salt-cedar-193x278.jpg" alt="">
                        </a>
                    </div>
                    <div class="tab-summary">
                        <div class="post-title">
                            <h3><a href="https://example.invalid/manga/salt-and-cedar/">Salt and Cedar</a></h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="c-footer">
    <p>Example Reader</p>
</footer>
</body>
</html>
