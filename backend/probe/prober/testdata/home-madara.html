<!--
  SYNTHETIC FIXTURE — not a recording of any site.

  Reproduces the shape of a Madara *home* page: the theme's own stylesheet
  under /wp-content/themes/madara/, the madara-core plugin's script, a body
  class carrying the wp-manga custom post type, and a #loop-content listing of
  .page-listing-item / .page-item-detail cards. This is what PLAN §7.5 stage 2
  fetches and stages 3 and 4 judge.

  FIDELITY CORRECTION 2026-09-16 — this fixture used to be wrong in two ways
  that mattered, and between them they cost a user the largest site family we
  support:

    1. It served its assets from /wp-content/plugins/madara/. No live install
       does: Madara is distributed as a WordPress *theme*, and its companion
       plugin registers as `madara-core`. That was the fingerprint's single
       heaviest signal, worth 40 of 60.
    2. It built its listing out of .c-tabs-item__content cards. That is the
       *search results* rendering. A real home page uses .page-listing-item
       wrappers around .page-item-detail cards, and carries none of the search,
       series or reader markup at all.

  The fixture scored 88 while the real thing scored 43, and the fingerprint was
  tuned against the fixture. docs/THEME-NOTES.md had predicted exactly this:
  fixtures pin our parser, not reality. A fixture whose score does not resemble
  the real page's is worse than no fixture, because it is evidence that is not
  evidence.

  Why synthetic: PLAN §1.3 forbids this repository from containing source URLs
  or anything that functions as a catalogue, and §1.4 forbids copying others'
  expression. The markup *structure* is a documented, observable property of a
  distributed WordPress theme; the content here is invented and the host is
  example.invalid (RFC 2606), which can never resolve.

  Deliberate variations exercised by the tests:
    - a <title> with a marketing tail, so the default source name has to be
      trimmed back to "Example Reader" (probe stage 6);
    - <html lang="en-GB">, so the draft source's lang is derived, not assumed;
    - only home-page markup, so the fingerprint has to clear its threshold on
      the listing signals alone — which is the situation the probe is always in.
-->
